<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FuriArena</title>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="logo-name-links">
        <a href="index.html"><div class="logo-name">
          <div class="logo">
            <img src="assets/img/furia-logo.svg" alt="" />
          </div>
          <div class="name">FuriArena</div>
        </div></a>

        <div class="nav-links">
          <a href="http://localhost:3000/index.html#tela-inicial"><div class="link">Inicio</div></a>
          <a href="http://localhost:3000/index.html#tela-calendario"
            ><div class="link">Calendário de Jogos</div></a
          >
          <a href="https://www.furia.gg/"><div class="link">Loja</div></a>
        </div>
      </div>

      <div class="username-profile">
        <span id="userName"></span>
        <iconify-icon icon="iconamoon:profile" class="profile"></iconify-icon>
        <iconify-icon icon="iconamoon:exit" class="exit"></iconify-icon>
      </div>
    </nav>

    <div class="wrapper-chat">
      <div class="title">Chat da Galera</div>
      <form id="chat">
        <div class="container-chat">
          <div class="grid-chat">
          </div>
          <div class="textbox-submit">
            <input type="text" class="textbox" name="message" placeholder="Digite sua mensagem"/>
            <button type="submit" class="submit">Enviar</button>
          </div>
        </div>
      </form>
    </div>

    <script src="https://code.iconify.design/iconify-icon/2.3.0/iconify-icon.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.8.1/socket.io.js"></script>
    <script src="assets/js/main.js"></script>
  </body>
</html>
